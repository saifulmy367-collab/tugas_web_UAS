<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaksi | AuresaGlow</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#FAF6F0',
                            primary: '#D4A373',
                            dark: '#1F3A2B',
                            rose: '#FCEADE'
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif']
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style/style.css">
</head>

<body class="bg-brand-light font-sans text-gray-800">

    <!-- HEADER -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="../index.html" class="flex items-center gap-2">
                <div class="w-10 h-10 bg-brand-dark text-brand-primary rounded-full flex items-center justify-center font-serif text-xl font-bold">
                    AG
                </div>
                <div>
                    <h1 class="font-serif text-2xl font-black text-brand-dark leading-none">AuresaGlow</h1>
                    <p class="text-[9px] uppercase tracking-widest text-brand-primary font-bold">Organic Cosmetics</p>
                </div>
            </a>

            <a href="cart.html" class="text-sm font-bold text-brand-dark hover:text-brand-primary">
                Kembali ke Keranjang
            </a>
        </div>
    </header>

    <!-- TRANSAKSI -->
    <section class="py-20">
        <div class="container mx-auto px-4 max-w-5xl">

            <div class="text-center mb-12">
                <span class="text-brand-primary font-bold uppercase text-sm tracking-widest">Checkout</span>
                <h2 class="font-serif text-4xl font-black text-brand-dark mt-2">
                    Form Transaksi
                </h2>
                <p class="text-gray-500 mt-3 text-sm">
                    Lengkapi data pembelian untuk menyelesaikan simulasi transaksi.
                </p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

                <!-- FORM PEMBELI -->
                <div class="bg-white rounded-2xl shadow-md border p-6">
                    <h3 class="font-serif text-2xl font-bold text-brand-dark mb-6">
                        Data Pembeli
                    </h3>

                    <form id="transactionForm" class="space-y-4">

                        <div>
                            <label class="block text-sm font-bold text-gray-600 mb-2">
                                Nama Lengkap
                            </label>
                            <input type="text" id="buyerName" required
                                   class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:border-brand-primary"
                                   placeholder="Masukkan nama lengkap">
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-600 mb-2">
                                Nomor WhatsApp
                            </label>
                            <input type="tel" id="buyerPhone" required
                                   class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:border-brand-primary"
                                   placeholder="Contoh: 081234567890">
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-600 mb-2">
                                Alamat Pengiriman
                            </label>
                            <textarea id="buyerAddress" required rows="3"
                                      class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:border-brand-primary"
                                      placeholder="Masukkan alamat lengkap"></textarea>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-600 mb-2">
                                Metode Pembayaran
                            </label>
                            <select id="paymentMethod"
                                    class="w-full p-3 rounded-lg border border-gray-300 bg-white focus:outline-none focus:border-brand-primary">
                                <option value="COD">COD (Bayar di Tempat)</option>
                                <option value="Transfer Bank">Transfer Bank</option>
                                <option value="E-Wallet">E-Wallet</option>
                            </select>
                        </div>

                        <button type="submit"
                                class="w-full bg-brand-primary text-white py-3 rounded-lg font-bold hover:bg-brand-dark transition">
                            Konfirmasi Transaksi
                        </button>

                    </form>
                </div>

                <!-- RINGKASAN PESANAN -->
                <div class="bg-white rounded-2xl shadow-md border p-6">
                    <h3 class="font-serif text-2xl font-bold text-brand-dark mb-6">
                        Ringkasan Pesanan
                    </h3>

                    <div id="transactionItems" class="space-y-4">
                        <!-- Diisi dari localStorage oleh JS -->
                    </div>

                    <div class="border-t mt-6 pt-6 space-y-3">
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-500">Subtotal Produk</span>
                            <span id="transactionSubtotal" class="font-bold">Rp 0</span>
                        </div>

                        <div class="flex justify-between text-sm">
                            <span class="text-gray-500">Ongkos Kirim</span>
                            <span id="transactionShipping" class="font-bold">Rp 10.000</span>
                        </div>

                        <div class="flex justify-between text-lg">
                            <span class="font-bold text-brand-dark">Total Pembayaran</span>
                            <span id="transactionTotal" class="font-serif font-black text-brand-primary">Rp 0</span>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </section>

    <footer class="bg-brand-dark text-white py-8 text-center">
        <p class="text-sm text-gray-300">
            &copy; 2026 AuresaGlow Organic Cosmetics.
        </p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>
